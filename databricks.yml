bundle:
  name: consumer-complaints-ml

include:
  - databricks/resources/*.yml

sync:
  include:
    - databricks/src/**/*.py
    - databricks/notebooks/**/*.ipynb
    - databricks/notebooks/consumer_complaints_ml_features.ipynb
    - databricks/notebooks/consumer_complaints_ml_train.ipynb
  # sync.include only ADDS patterns to what gets synced - it does not restrict sync to just these
  # patterns. Without an explicit exclude, everything not already gitignored (flask_app/app.py,
  # templates/, etc.) still gets uploaded to the workspace by default, even though the Flask app
  # is a purely local artifact that never runs on Databricks.
  exclude:
    - flask_app/**

targets:
  dev:
    default: true
    mode: development

    workspace:
      host: https://dbc-cf5e754b-fc10.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
