resources:
  jobs:
    consumer_complaints_bronze_job:
      name: consumer-complaints-pipeline-${bundle.target}

      description: >
        Runs the Consumer Complaints Bronze and Silver pipeline.

      max_concurrent_runs: 1

      tasks:
        - task_key: create_consumer_complaints_bronze

          spark_python_task:
            python_file: ../src/bronze/consumer_complaints_bronze.py
            source: WORKSPACE

          environment_key: default
          timeout_seconds: 14400

        - task_key: create_consumer_complaints_silver

          depends_on:
            - task_key: create_consumer_complaints_bronze

          spark_python_task:
            python_file: ../src/silver/consumer_complaints_silver.py
            source: WORKSPACE

          environment_key: default
          timeout_seconds: 14400


      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: []
